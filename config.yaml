# Schematics AI Tutor configuration. Documented in docs/design.md §7.
# The API key is never stored here (see backend/keys/README.md).

# true for a public deployment: hides debug features (e.g. the editor's JSON view).
# Read by the frontend build (frontend/vite.config.js); restart the dev server after a change.
# SCHEMATICS_PUBLIC=true|false overrides it; the Dockerfile sets true for the deployed build.
public: false

editor:                        # the grid editor; read by the frontend build (restart the dev server after a change)
  reference_grid: { columns: 12, rows: 8 }  # every task is fitted as if at least this big, so the scale
  reference_inventory: 4       # stays the same across tasks; parts in the inventory (docs/gui.md §6)

logs:                          # archived at startup, by size and nightly (docs/deployment.md §5)
  enabled: true                # write a usage and cost log per backend run
  dir: logs                    # relative to the repo root; gitignored. SCHEMATICS_LOGS_DIR overrides it (Fly: /data/logs)
  history_dir: history         # gzipped earlier parts, inside dir
  max_file_mb: 20              # archive when a log's current part grows past this
  history_max_mb: 200          # history budget for all logs; oldest files deleted first
  nightly_utc: "10:00"         # daily archive (3 am Pacific)

# USD per million tokens, used for cost estimates in the logs.
# Check against the current Anthropic pricing page when changing models.
pricing:
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125 }

claude:
  tutor_reaction:              # idle-triggered reactions
    model: claude-opus-5-5
    effort: low
    max_tokens: 16000
    timeout_s: 30
  tutor_request:               # learner message / hint
    model: claude-opus-5-5
    effort: low                # half the wait of medium (~4 s vs. ~9 s), same quality in testing
    max_tokens: 16000
    timeout_s: 30
  skill_summary:               # bonus: Learning Path screen
    model: claude-opus-5-5
    effort: low
    max_tokens: 16000
    timeout_s: 30
  experience:                  # the 🔔 feedback conversation (research, docs/design.md §5)
    model: claude-opus-5-5
    effort: low
    max_tokens: 16000
    timeout_s: 30
  down_s: 300                  # after a connection error, timeout, 429, 529 or exhausted balance,
                               # Claude is skipped this long: tasks from the fallback pack, plain tutor messages
  task_generation:
    model: claude-opus-5-5
    effort: high
    max_tokens: 16000
    timeout_s: 120
    max_validate_calls: 5        # validate_grid tool calls per attempt
    max_attempts: 2              # failed attempts before giving up and telling the learner

tutor:
  idle_threshold_ms: 1500
  max_snapshots: 10
  history_turns: 6
  offer_hint_after_reactions: 3
  react_after_unchanged: 4      # pauses with an unchanged circuit before Claude is called anyway
  formulas_from_level: 2       # curriculum level from which replies may carry a formula
  formula_max_lines: 8         # a formula's lines at most (rung 4 of the hint ladder needs the most)

task_generation:
  recent_tasks: 10
  fallback_variants: 3          # tasks per skill level in the fallback pack (backend/data/fallback/)

pregeneration:                 # tasks generated ahead of time and cached (docs/design.md §3)
  enabled: true
  first_task_pool: 2           # ready first tasks for new learners, filled at startup
  max_entries: 50              # cached or running generations, oldest dropped first
  ttl_s: 3600                  # a cached task older than this is dropped

research:                      # learner experience research, with consent (docs/design.md §5)
  enabled: true
  dir: research                # SCHEMATICS_RESEARCH_DIR overrides it (Fly: /data/research)
  max_mb_per_learner: 20
  prompt_from_level: 3         # curriculum level
  prompt_every_active_min: 6
  prompt_idle_s: 8              # the 🔔 prompt waits for this long a pause in editing
  thread_timeout_active_min: 3 # an unanswered feedback conversation closes after this much active time
  max_followups: 2

evaluator:
  near_target_ratio: 0.10      # "near_target" when within 10% of every target
  resistor_max_power_w: 5      # above this, a resistor is "overcurrent"
