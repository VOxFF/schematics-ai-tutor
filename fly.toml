# Fly.io deployment (docs/design.md §4). Deploy with: fly deploy
app = "schematics-ai-tutor"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Exactly one machine, always on: the task cache, the first-task pool and the rate limits
  # live in memory, and a cold start would refill the pool with fresh Claude calls.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"     # learning sessions are long-lived WebSockets
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
