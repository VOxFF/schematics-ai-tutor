# Schematic style for the grid editor (docs/gui.md §4).
# Sizes are in grid units: one step between neighboring grid points is 40.
# Colors are hex strings. Edit and save; the dev server reloads the page.

canvas:
  background: "#fbfaf6"        # paper tint behind the grid

grid:
  hole_radius: 1.6             # empty pin hole (grid point)
  hole_color: "#d8d4c8"
  connected_hole_radius: 2.2   # round joint where wires meet at a hole

wire:
  thickness: 2
  color: "#2f3640"

pin:
  connector_radius: 3.2        # dot on each component pin
  lead_thickness: 2            # line from the pin to the symbol body
  color: "#1f2328"

outline:
  thickness: 1.5               # border of resistor bodies
  color: "#1f2328"

resistor:
  length: 38                   # along the leads
  height: 13
  fill: "#f1e3c6"
  band_width: 3.5

battery:
  long_plate: 28               # positive plate length
  short_plate: 15              # negative plate length
  long_plate_thickness: 2.5
  short_plate_thickness: 5
  gap: 9                       # distance between the plates
  positive_color: "#cf222e"    # the positive plate
  negative_color: "#1f2328"
  sign_size: 15                # font size (px) of the + and − marks
  sign_plate_offset: 9         # + and − sit this far out from their plate, along the lead
  sign_wire_offset: 9          # ...and this far from the wire, both on the same side

meter:
  radius: 19
  outline_thickness: 2.5       # meters only; other outlines use outline.thickness
  letter_size: 19              # font size (px) of A / V
  voltmeter_fill: "#eaf2fc"
  ammeter_fill: "#fdf3d7"

labels:
  size: 12                     # font size (px) of part labels and readings
  gap: 7.2                     # space between a part's edge and its labels

selection:
  color: "#0969da"             # outline around the selected element
  width: 2.5                   # outline width beyond the element's shape

highlight:                     # tutor highlights, by style (docs/gui.md §4)
  attention: "#bf8700"         # amber: look here
  error: "#cf222e"             # red: a problem
  success: "#1a7f37"           # green: done right
  width: 4                     # outline width; wider than the selection's, so both show
  ring_radius: 9               # ring around a highlighted grid point
