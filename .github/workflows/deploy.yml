# Deploy main by hand (Actions tab), or put main back live when a PR closes without merging:
# ci.yml deployed that PR's code (docs/deployment.md §3).
name: deploy

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.merged
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: main
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --env SCHEMATICS_COMMIT=${{ steps.main.outputs.commit }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Smoke test
        run: ./smoke.sh https://schematics-ai-tutor.fly.dev ${{ needs.deploy.outputs.commit }}
