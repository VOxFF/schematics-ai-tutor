# ./check.sh on every pull request push and on main. It never deploys: shipping is deploy.yml,
# started by the `deploy` label (docs/deployment.md §3).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Integrity checks
        run: ./check.sh
