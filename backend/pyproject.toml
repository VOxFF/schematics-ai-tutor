[project]
name = "schematics-tutor-backend"
version = "0.1.0"
description = "Evaluator and Claude tutor service for Schematics AI Tutor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6",
    "anthropic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real Claude API and cost money; run them with ./test.sh live.
markers = ["live: calls the real Claude API"]
addopts = "-m 'not live'"
